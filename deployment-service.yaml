apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlshortener-deployment
  labels:
    app: urlshortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urlshortener
  template:
    metadata:
      labels:
        app: urlshortener
    spec:
      containers:
      - name: urlshortener
        image: asia-south1-docker.pkg.dev/url-shortener-475637/node-urlshortener/urlshortener:latest
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metaData:
  name: urlshortener-service
spec: 
  type: LoadBalancer
  selector:
    app: urlshortener
  ports:
  - port: 80
    targetPort: 3000